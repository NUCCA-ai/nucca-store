name: Ежедневная публикация в Telegram

on:
  schedule:
    # 07:00 UTC = 10:00 по Москве
    - cron: "0 7 * * *"
  workflow_dispatch:      # кнопка ручного запуска

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить зависимости
        run: pip install requests

      - name: Установить ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Сделать обложки для видео
        run: python scripts/make_thumbs.py

      - name: Опубликовать товары
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/publish.py

      - name: Сохранить результат
        run: |
          git config user.name "nucca-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Изменений нет."
          else
            git commit -m "Публикация $(date +%Y-%m-%d)"
            git push
          fi
